services:
  cancionero:
    build: .
    container_name: cancionero
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DB_PATH: /data/app.db
      PORT: 3000
    volumes:
      - ./data:/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/api/salud').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
